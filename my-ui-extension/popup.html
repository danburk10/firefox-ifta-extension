<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Popup Example</title>
  <style>
    body {
      font-family: sans-serif;
      width: 250px;
      padding: 10px;
    }
    textarea {
      width: 100%;
      height: 80px;
      margin-bottom: 10px;
      resize: vertical;
    }
    input[type="text"] {
      width: 30px;
      text-align: center;
      margin-bottom: 10px;
    }
    button {
      width: 48%;
      padding: 5px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h3>Example Popup</h3>
  <textarea id="largeText" placeholder="Enter your text here..."></textarea><br>
  <input id="charInput" type="text" maxlength="1" placeholder=","><br>
  <button id="btn1">Run Script</button>
  <button id="btn2">Clear</button>

  <script src="popup.js"></script>
</body>
</html>
